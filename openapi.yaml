openapi: 3.1.1
info:
  title: API MiniBlog
  version: 1.0.0
  description: API REST de un blog con autores y posts.

paths:
  /authors:
    get:
      summary: Lista todos los autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      summary: Crea un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '201':
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El email ya existe

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Obtiene un autor por id
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualiza un autor (solo los campos enviados)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorInput'
      responses:
        '200':
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El email ya existe
    delete:
      summary: Borra un autor y sus posts
      responses:
        '204':
          description: Autor borrado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts:
    get:
      summary: Lista todos los posts
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: Crea un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: El autor no existe

  /posts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Obtiene un post por id
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Actualiza un post (solo los campos enviados)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostInput'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Borra un post
      responses:
        '204':
          description: Post borrado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /posts/author/{authorId}:
    get:
      summary: Posts de un autor, con los datos del autor
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Posts del autor (lista vacía si no tiene)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostWithAuthor'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Datos inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Author:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ana García }
        email: { type: string, example: ana@mail.com }
        bio: { type: string }
        created_at: { type: string, format: date-time }
    AuthorInput:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string }
        bio: { type: string }
    Post:
      type: object
      properties:
        id: { type: integer, example: 1 }
        title: { type: string }
        content: { type: string }
        author_id: { type: integer, example: 1 }
        published: { type: boolean, example: false }
        created_at: { type: string, format: date-time }
    PostInput:
      type: object
      required: [title, content, author_id]
      properties:
        title: { type: string }
        content: { type: string }
        author_id: { type: integer }
        published: { type: boolean }
    PostWithAuthor:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string }
        published: { type: boolean }
        created_at: { type: string, format: date-time }
        author_id: { type: integer }
        author_name: { type: string }
        author_email: { type: string }
    Error:
      type: object
      properties:
        error: { type: string, example: post not found }
